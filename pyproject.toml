[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ttbverify"
version = "0.1.0"
description = "TTB alcohol label verification core (Phase 0)"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
vlm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["ttbverify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "corpus: golden/accuracy layer; needs the tesseract binary and generated fixtures",
    "realistic: accuracy layer over the realistic (styled + degraded) corpus",
]
